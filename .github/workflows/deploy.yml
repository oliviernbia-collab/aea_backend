name: Déploiement backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node_modules est construit ici (CI) et envoyé tel quel par FTP : le serveur n'a pas
      # d'accès shell (SSH/SFTP fermé côté hébergeur), donc "npm install" ne peut pas tourner
      # sur place. Les dépendances de ce projet sont en JS pur (pas de module natif type
      # "bcrypt" compilé - voir bcryptjs dans package.json), donc aucun souci de compatibilité
      # binaire entre ce runner Linux et le serveur.
      - run: npm ci --omit=dev

      # Convention Passenger (utilisée par "Setup Node.js App" de cPanel) : la présence/mise à
      # jour de ce fichier déclenche un redémarrage de l'appli sans coupure de service. Comme on
      # ne peut pas faire `touch` à distance, on envoie un fichier neuf à chaque déploiement.
      - run: mkdir -p tmp && date > tmp/restart.txt

      - name: Publier par FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.DEPLOY_PATH }}/
          # Resynchronisation complete (plutot que la detection de changements habituelle de
          # l'action, basee sur un etat stocke cote serveur) : plusieurs deploiements recents ont
          # ete rapportes "success" sans que certains fichiers modifies soient reellement mis a
          # jour sur le serveur, ce qui suggere un etat de sync desynchronise. Plus lent, mais
          # garantit que le serveur reflete exactement ce depot a chaque deploiement.
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/.env
            **/uploads/**
            **/public/**
            **/node_modules/.cache/**
